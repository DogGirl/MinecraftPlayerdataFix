// ──────────────────────────────────────────────────────
// plugins – use the plugin DSL so FG6 can create run tasks
// ──────────────────────────────────────────────────────
plugins {
    id 'net.minecraftforge.gradle' version '6.0.23'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'maven-publish'
    id 'org.spongepowered.mixin' version '0.7.+'
}


group = 'com.msdoggirl.playerdatafix'
version = '1.0.0'
archivesBaseName = 'playerdatamod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)


mixin {
    add sourceSets.main, "mixins.playerdatamod.refmap.json"
    config "mixins.playerdatamod.json"
}

// ──────────────────────────────────────────────────────
// Minecraft / Forge
// ──────────────────────────────────────────────────────
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { playerdatamods { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { seven_systems { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'playerdatamod', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods { playerdatamod { source sourceSets.main } }
        }

    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0:mapped_parchment_2023.09.03-1.20.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}


jar {
    manifest {
        attributes(
            'Specification-Title'     : 'playerdatamod',
            'Specification-Vendor'    : 'MsDogGirl',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : 'MsDogGirl'
        )
    }
}